name: Build & CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build-type: [debug, release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Fetch STM32CubeF4 / FreeRTOS / lwIP dependencies
        run: bash scripts/fetch_deps.sh

      - name: Build (${{ matrix.build-type }})
        run: |
          if [ "${{ matrix.build-type }}" = "release" ]; then
            make BUILD=release OPTFLAGS="-O2 -DNDEBUG"
          else
            make BUILD=debug OPTFLAGS="-Og -g3"
          fi

      - name: Show binary size
        run: arm-none-eabi-size modbus_bridge.elf

      - name: Generate firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.build-type }}
          path: |
            modbus_bridge.elf
            modbus_bridge.hex
            modbus_bridge.bin
            modbus_bridge.map
          retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run cppcheck static analysis
        uses: deep5050/cppcheck-action@v1
        with:
          enable: all
          inconclusive: enable
          suppress: missingIncludeSystem,unusedFunction
          std: c11
          platform: unix32
          source: Core/Src
          include: Core/Inc
          output: cppcheck_report.xml

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.xml
          retention-days: 7
