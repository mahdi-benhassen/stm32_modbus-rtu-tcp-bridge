name: Build & CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build-type: [debug, release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: .deps_cache
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch STM32CubeF4 / FreeRTOS / lwIP dependencies
        run: bash scripts/fetch_deps.sh

      - name: Build (${{ matrix.build-type }})
        run: |
          if [ "${{ matrix.build-type }}" = "release" ]; then
            make BUILD=release OPTFLAGS="-O2 -DNDEBUG"
          else
            make BUILD=debug OPTFLAGS="-Og -g3"
          fi

      - name: Show binary size
        run: arm-none-eabi-size modbus_bridge.elf

      - name: Generate firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.build-type }}
          path: |
            modbus_bridge.elf
            modbus_bridge.hex
            modbus_bridge.bin
            modbus_bridge.map
          retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck static analysis
        run: |
          cppcheck \
            --enable=all \
            --inconclusive \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --std=c11 \
            --platform=unix32 \
            -I Core/Inc \
            --xml \
            --xml-version=2 \
            Core/Src 2> cppcheck_report.xml || true

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.xml
          retention-days: 7
